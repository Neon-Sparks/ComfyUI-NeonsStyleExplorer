name: Publish to Comfy registry

# Runs on every push that changes the version in pyproject.toml, and on demand
# from the Actions tab. Needs a repository secret REGISTRY_ACCESS_TOKEN holding
# a Comfy Registry API key.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
